<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>镜观数据库</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">JG</span>
      <div>
        <h1>镜观数据库</h1>
        <p>科研数据抽取与校验</p>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="overview">总览</button>
      <button class="nav-item" data-view="inspect">流水线检查</button>
      <button class="nav-item" data-view="tables">数据表</button>
      <button class="nav-item" data-view="query">查询</button>
    </nav>
    <div class="db-status" id="dbStatus">连接中...</div>
  </aside>

  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Jinguan SQLite Console</p>
        <h2 id="viewTitle">总览</h2>
      </div>
      <button class="refresh" id="refreshButton" title="刷新">刷新</button>
    </header>

    <section class="view active" id="overviewView">
      <div class="metric-grid" id="metrics"></div>

      <div class="panel-grid">
        <section class="panel">
          <div class="panel-head">
            <h3>最近运行</h3>
          </div>
          <div class="table-wrap">
            <table id="latestRunsTable"></table>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h3>模板库</h3>
          </div>
          <div class="table-wrap">
            <table id="templatesTable"></table>
          </div>
        </section>
      </div>

      <div class="panel-grid">
        <section class="panel">
          <div class="panel-head">
            <h3>运行状态</h3>
          </div>
          <div id="runStatusList" class="status-list"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h3>校验问题</h3>
          </div>
          <div id="issuesList" class="status-list"></div>
        </section>
      </div>
    </section>

    <section class="view" id="inspectView">
      <div class="inspect-layout">
        <aside class="run-list" id="runList"></aside>

        <section class="inspect-main">
          <section class="panel">
            <div class="panel-head split">
              <div>
                <h3 id="inspectRunTitle">选择运行任务</h3>
                <p id="inspectRunMeta"></p>
              </div>
              <span class="status-pill" id="inspectRunStatus">-</span>
            </div>
            <div class="flow" id="pipelineFlow"></div>
          </section>

          <section class="panel">
            <div class="panel-head split">
              <div>
                <h3>解析表格与路由</h3>
                <p id="tableInspectMeta"></p>
              </div>
              <select id="parsedTableSelect" aria-label="选择解析表格"></select>
            </div>
            <div class="table-inspector">
              <div class="markdown-preview" id="markdownPreview"></div>
              <div class="route-detail" id="routeDetail"></div>
            </div>
          </section>
        </section>

        <aside class="inspect-side">
          <section class="panel">
            <div class="panel-head">
              <h3>事件日志</h3>
            </div>
            <div class="timeline" id="eventTimeline"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3>校验问题</h3>
            </div>
            <div class="issue-feed" id="issueFeed"></div>
          </section>
        </aside>
      </div>
    </section>

    <section class="view" id="tablesView">
      <div class="workspace">
        <aside class="table-list" id="tableList"></aside>
        <section class="panel table-panel">
          <div class="panel-head split">
            <div>
              <h3 id="tableTitle">选择一张表</h3>
              <p id="tableMeta"></p>
            </div>
            <div class="pager">
              <button id="prevPage" title="上一页">上一页</button>
              <button id="nextPage" title="下一页">下一页</button>
            </div>
          </div>
          <div class="table-wrap tall">
            <table id="dataTable"></table>
          </div>
        </section>
      </div>
    </section>

    <section class="view" id="queryView">
      <section class="panel">
        <div class="panel-head split">
          <div>
            <h3>只读 SQL</h3>
            <p>仅允许 SELECT / WITH 查询</p>
          </div>
          <button id="runQuery">运行</button>
        </div>
        <textarea id="sqlInput" spellcheck="false">SELECT * FROM v_run_overview LIMIT 20</textarea>
        <div class="query-meta" id="queryMeta"></div>
        <div class="table-wrap tall">
          <table id="queryTable"></table>
        </div>
      </section>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
